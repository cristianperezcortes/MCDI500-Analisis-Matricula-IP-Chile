name: MCDI500 - reproducibilidad y calidad
on:
  push:
    branches: [main, 'fix/**', 'feat/**', 'docs/**']
  pull_request:
    branches: [main]
jobs:
  calidad:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalación limpia de dependencias fijadas
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Comprobar dependencias
        run: |
          python -m pip check
          python scripts/verificar_entorno.py
      - name: Validar sintaxis Python
        run: python -m compileall -q src tests scripts
      - name: Comprobar el origen CNED accesible y su SHA-256
        run: python scripts/verificar_entorno.py --exigir-fuente
      - name: Reproducir F1, F2, F3 y F4 en copia limpia con datos reales
        run: python scripts/reproducir_desde_cero.py --ejecutar --mantener-derivados-ci
      - name: Pruebas reales, portátiles y de equivalencia F2-F3
        run: python -m pytest -q tests --junitxml=evidencias/pytest_ci.xml
      - name: Auditoría F3 notebook/CSV/PDF
        run: python scripts/auditar_entrega_f3.py
      - name: Auditoría académica F1/F2
        run: python scripts/auditar_consistencia_academica.py
      - name: Ejecutar y verificar F4 con agregados versionados
        run: python scripts/verificar_f4_publicada.py
      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-mcdi500-${{ matrix.os }}
          path: evidencias/pytest_ci.xml

# CI valida F1-F4 usando el subconjunto original IP 2025 versionado.
# Cuando está disponible, el libro Excel original identificado por SHA-256 tiene prioridad.
